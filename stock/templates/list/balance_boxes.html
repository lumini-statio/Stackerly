{% extends 'base.html' %}
{% load django_tables2 crispy_forms_tags %}
{% load render_table from django_tables2 %}

{% block content %}
<div style="view-transition-name: boxes;" class="w-50">
    {% cache 900 boxes request.user.id %}
        <a href="{% url 'home' %}" class="btn btn-dark mb-5">
            <i class="fa fa-solid fa-arrow-left text-light"></i>
        </a>

        <div class="d-flex justify-content-center mb-5">
            <h1 style="color: #fff;">Balance Boxes</h1>
        </div>
    {% endcache %}

    {% render_table table %}
</div>
{% endblock %}
